# InkDeck server (dashboard + companion). Copy .env.example to .env, fill it in, then:
#   docker compose up -d        # dashboard on http://localhost:8080
services:
  inkdeck-stats:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - inkdeck-data:/data   # the clone of your journal and the weather cache

volumes:
  inkdeck-data:
